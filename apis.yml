aid: moonpay
name: MoonPay
description: >-
  MoonPay is a crypto payments infrastructure company that lets businesses and
  their users buy, sell, and swap digital assets. Its developer platform exposes
  a Platform API and a Widget API over https://api.moonpay.com covering fiat-to-crypto
  on-ramp, crypto-to-fiat off-ramp, token swaps and cross-chain bridging, virtual
  bank accounts for programmatic banking, DeFi token data, KYC/customer management,
  and a rich webhook event surface. MoonPay ships first-party JavaScript SDKs (the
  moonpay-js widget SDK and login SDK), web and React Native inline components, a
  CLI (@moonpay/cli), a published MCP server, and an official Agent Skills library
  ("skills for AI agents to move money"). Surfaced as a portfolio company of Paradigm
  and Speedinvest and enriched from its public developer surface.
